{% extends "base.html" %}
{% block title %}持仓 / 仓单分析{% endblock %}
{% block content %}
<h4 class="mb-3">持仓 / 仓单分析</h4>
<div class="list-group">
  {% for v in varieties %}
  <a class="list-group-item list-group-item-action" href="{{ url_for('position.position_detail', code=v.code) }}">
    {{ v.name }}（{{ v.code }}） — {{ v.exchange }}
  </a>
  {% endfor %}
</div>
{% endblock %}
